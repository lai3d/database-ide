name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Test
        run: swift test
      - name: Bundle app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh
      - name: Zip app
        run: ditto -c -k --keepParent build/DBIDE.app "build/DBIDE-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/DBIDE-${GITHUB_REF_NAME}.zip" \
            --title "DBIDE $GITHUB_REF_NAME" --generate-notes \
            --notes "Ad-hoc signed, not notarized: right-click → Open the first time (or run xattr -dr com.apple.quarantine DBIDE.app)."
